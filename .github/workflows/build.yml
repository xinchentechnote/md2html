name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest = arm64：原生验证 arm64，同机交叉产出 x64
          - os: macos-latest
            targets: macos-arm64 macos-x64
            smoke: macos-arm64
            artifact: macos
          # linux-x64 产物为 musl 全静态（linuxstatic），CentOS 7 / Alpine 等
          # 老 glibc 系统可直接运行
          - os: ubuntu-latest
            targets: linux-x64
            smoke: linux-x64
            artifact: linux-x64
          # linux arm64 真机验证；公共仓库免费，私有仓库不可用时：
          # 删除本项并把上一项 targets 改为 "linux-x64 linux-arm64"（交叉产出，不验证 arm）
          - os: ubuntu-24.04-arm
            targets: linux-arm64
            smoke: linux-arm64
            artifact: linux-arm64
          # win-x64 = Win10+（node22 基座）。Win7 已放弃支持：
          # Node 18+ 官方构建要求 Win10+，旧基座（node14）工具链不再维护
          - os: windows-latest
            targets: win-x64
            smoke: win-x64
            artifact: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/build-bin.mjs ${{ matrix.targets }}
      - name: smoke tests
        shell: bash
        run: for t in ${{ matrix.smoke }}; do node scripts/smoke-test.mjs "$t"; done
      - uses: actions/upload-artifact@v4
        with:
          name: md2html-${{ matrix.artifact }}
          path: dist/*

  # 打 v* tag 时，把各平台产物挂到 GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
